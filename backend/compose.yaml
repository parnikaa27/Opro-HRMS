# Local database for development: docker compose up -d
name: opro-hrms

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: opro_hrms
      POSTGRES_USER: opro
      # Development only, matches application-dev.yml. Never reuse it anywhere real.
      POSTGRES_PASSWORD: opro-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - opro-hrms-data:/var/lib/postgresql

volumes:
  opro-hrms-data:
