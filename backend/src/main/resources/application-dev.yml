# Local development: the Docker Compose database, the mock's people, and the pick a user login.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/opro_hrms
    username: opro
    password: opro-dev-only
  flyway:
    locations: classpath:db/migration,classpath:db/dev

opro:
  dev:
    # No biometric device yet: fill recent weeks with believable punches on start up.
    generate-punches: true

server:
  servlet:
    session:
      cookie:
        # Safari refuses Secure cookies on http://localhost. Every other environment keeps them Secure.
        secure: false

# Browse the API at http://localhost:8080/swagger-ui.html, or fetch the spec from /v3/api-docs.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
