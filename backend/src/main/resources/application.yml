spring:
  application:
    name: hrms-backend
  # Set per environment. No database address or password lives in the code.
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        name: opro_session
        http-only: true
        secure: true
        same-site: strict

opro:
  time-zone: Indian/Maldives
